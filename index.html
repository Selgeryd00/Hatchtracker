<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c33"><title>HatchTracker</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#eef3ed;color:#183a31;font:16px system-ui}main{max-width:540px;margin:auto;padding:24px}h1{margin:0 0 8px}section{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 20px #183a3111}label{display:block;margin:12px 0 4px}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b9c9c1;border-radius:10px}button{background:#17674b;color:white;font-weight:700;border:0;margin-top:12px}small{color:#557366}strong.big{font-size:36px}li{margin:8px 0}</style></head><body><main><h1>HatchTracker 🐣</h1><p>Din kläckningsjournal</p><section><label>Äggen lades in</label><input id="start" type="date"><label>Antal ägg</label><input id="eggs" type="number" min="0"><p><strong class="big" id="day">–</strong></p><p id="due"></p><p id="tip"></p></section><section><h2>Registrera mätning</h2><label>Temperatur (°C)</label><input id="temp" type="number" step=".1" inputmode="decimal"><label>Luftfuktighet (%)</label><input id="humidity" type="number" min="0" max="100" step="1" inputmode="numeric"><label>Anteckning</label><textarea id="note" rows="3"></textarea><button id="save">Spara mätning</button></section><section><h2>Historik</h2><ul id="history"></ul><button id="backup">Exportera säkerhetskopia</button></section><small>Data lagras lokalt på denna enhet. Kläckning sker vanligen kring dag 21 men varierar.</small></main><script>const $=x=>document.getElementById(x),key='hatchtracker-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.logs||=[];function persist(){localStorage.setItem(key,JSON.stringify(state))}function render(){if(state.start)$('start').value=state.start;if(state.eggs!=null)$('eggs').value=state.eggs;if(state.start){const start=new Date(state.start+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);const n=Math.floor((today-start)/86400000)+1;const due=new Date(start);due.setDate(due.getDate()+21);$('day').textContent='Dag '+Math.max(0,n);$('due').textContent='Beräknad kläckning: '+due.toLocaleDateString('sv-SE');$('tip').textContent=n<1?'Ruvningen har inte börjat.':n<=17?'Kontrollera temperatur, fukt och vändning enligt maskinens anvisningar.':n<=21?'Slutfas: stoppa vändning omkring dag 18 och undvik onödiga öppningar.':'Kläckningsdatumet har passerat. Bedöm äggen försiktigt.'}else{$('day').textContent='Ange startdatum';$('due').textContent='';$('tip').textContent=''}$('history').replaceChildren(...state.logs.slice().reverse().map(x=>{const li=document.createElement('li');li.textContent=x.time+' — '+x.temp+' °C, '+x.humidity+' %'+(x.note?' — '+x.note:'');return li}))}$('start').onchange=e=>{state.start=e.target.value;persist();render()};$('eggs').onchange=e=>{state.eggs=e.target.value;persist();render()};$('save').onclick=()=>{if(!$('temp').value||!$('humidity').value){alert('Ange temperatur och luftfuktighet');return}state.logs.push({time:new Date().toLocaleString('sv-SE'),temp:$('temp').value,humidity:$('humidity').value,note:$('note').value});persist();$('note').value='';render()};$('backup').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hatchtracker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);</script></body></html>
