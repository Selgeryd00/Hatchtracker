name: Generate iPhone app icons
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-icons.yml"
      - "icon.svg"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build icons
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import base64, io, re
          svg=Path("icon.svg").read_text()
          encoded=re.search(r'data:image/jpeg;base64,([^"\s]+)',svg)
          if encoded is None:
              raise RuntimeError("No embedded JPEG found in icon.svg")
          jpeg=base64.b64decode(encoded.group(1),validate=True)
          image=Image.open(io.BytesIO(jpeg)).convert("RGB")
          print("Decoded original image:",image.size)
          for size,name in [(180,"apple-touch-icon.png"),(192,"icon-192.png"),(512,"icon-512.png")]:
              ImageOps.fit(image,(size,size),method=Image.Resampling.LANCZOS).save(name,format="PNG",optimize=True)
              print(name,Path(name).stat().st_size)
          PY
      - name: Commit icon files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Add real PNG icons for iPhone and PWA"
            git push origin HEAD:main
          fi
